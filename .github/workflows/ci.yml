name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dtr-core is consumed by api and web via its built dist/ (main + types),
      # so it must be compiled before typechecking or testing the consumers.
      - name: Build workspace libraries
        run: pnpm --filter @trustai/dtr-core build

      # Prisma 6 no longer generates the client on install. The api's model
      # types (TrustRecord, DigitalAsset, Anchor, ...) come from this step.
      # Generation only reads the schema — no database connection required.
      - name: Generate Prisma client
        run: pnpm --filter @trustai/api exec prisma generate

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Lint (web)
        run: pnpm --filter @trustai/web lint

      # Unit suites only (vitest). Docker-dependent e2e (test:e2e) are excluded
      # here on purpose: they need Postgres, Anvil and object storage.
      - name: Unit tests (all packages)
        run: pnpm -r test

  contracts:
    name: Smart contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build

      - name: Test contracts
        run: forge test -vvv
